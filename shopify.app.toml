# Shopify app configuration for Service Booking.
#
# URLs point at the deployed Render host, and
# automatically_update_urls_on_dev is false so `shopify app dev` cannot
# overwrite them with a tunnel that dies when the terminal closes.
#
# `shopify app deploy` pushes whatever is written here. To develop locally,
# run `shopify app dev` and let it use a tunnel for that session only; when it
# asks to update the app's URLs, answer no, or deploy this file again
# afterwards to put the Render URLs back.
#
# NOTE: shopify.app.production.toml carries the same client_id and the same
# URLs, so it is now redundant — both configs are the same app, and whichever
# is deployed last wins. A separate dev app with its own client_id is the
# proper fix if local dev and the installed app ever need to coexist.
#
# Never answer "yes" when `config link` offers to replace this file with the
# remote config: the remote copy of a new app is empty and wipes the scopes.

client_id = "bb2a5e647aa050c1e2059f6fe8bc367d"
name = "service-booking"
application_url = "https://service-booking-aqk7.onrender.com"
embedded = true

[access_scopes]
# read/write_products  — create and link the product that backs each service
# read_orders          — orders/create payload, to turn a paid order into a booking
# write_app_proxy      — required by Shopify for any app that declares [app_proxy]
#
# Request only what the code uses (App Store requirement 3.2). Add
# write_draft_orders / read+write_customers back only together with the code
# that needs them.
#
# Reading customer name, email and phone from an order is Protected Customer
# Data, so the app needs that approval at review (Partner Dashboard → API
# access → Protected customer data: Name, Email, Phone). It is unavoidable for
# a booking app — a confirmation email has to go somewhere.
# https://shopify.dev/docs/apps/launch/protected-customer-data
scopes = "read_products,write_products,read_orders,write_app_proxy,read_publications,write_publications"

[auth]
redirect_urls = [
  "https://service-booking-aqk7.onrender.com/auth/callback",
  "https://service-booking-aqk7.onrender.com/auth/shopify/callback",
  "https://service-booking-aqk7.onrender.com/api/auth/callback",
  "https://service-booking-aqk7.onrender.com/api/auth"
]

[app_proxy]
# Storefront-visible path is <shop>/apps/booking/*, which the theme app
# extension fetches for availability. The CLI rewrites `url` to the tunnel
# during `shopify app dev` only; set the production host in the production toml.
url = "https://service-booking-aqk7.onrender.com/proxy"
subpath = "booking"
prefix = "apps"

[webhooks]
# Keep in step with ApiVersion in app/shopify.server.ts. Do not let the CLI
# bump this to a release candidate.
api_version = "2026-10"

  # Handled by: app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # Handled by: app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # The booking pipeline. orders/create is the one that actually creates a
  # Booking row; the other two release the slot again.
  #
  # Order topics carry protected customer data: Shopify refuses to register
  # them until "Protected customer data access" (Name + Email) is saved for
  # this app in the Dev/Partner Dashboard → API access.
  #
  # Handled by: app/routes/webhooks.orders.create.tsx (Booking + confirmation email)
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  # Not handled yet — re-enable with their route files.
  # [[webhooks.subscriptions]]
  # topics = [ "orders/cancelled" ]
  # uri = "/webhooks/orders/cancelled"
  #
  # [[webhooks.subscriptions]]
  # topics = [ "refunds/create" ]
  # uri = "/webhooks/refunds/create"

  # Mandatory compliance topics for a public app.
  # https://shopify.dev/docs/apps/build/privacy-law-compliance
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[build]
automatically_update_urls_on_dev = false
