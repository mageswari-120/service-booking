# Shopify app configuration for Service Booking.
#
# Identity fields (client_id, application_url, auth.redirect_urls) are managed
# by the CLI: `shopify app dev` rewrites the URLs to the tunnel on every run.
# `shopify app deploy` does NOT — it pushes whatever is written here. Deploy to
# production from a separate shopify.app.production.toml whose application_url,
# redirect_urls and [app_proxy].url point at the real HTTPS host. Everything below them — scopes, the app proxy and the
# webhook list — is ours to maintain.
#
# Never answer "yes" when `config link` offers to replace this file with the
# remote config: the remote copy of a new app is empty and wipes the scopes.

client_id = "bb2a5e647aa050c1e2059f6fe8bc367d"
name = "service-booking"
application_url = "https://example.com"
embedded = true

[access_scopes]
# read/write_products  — create and link the product that backs each service
# read_orders          — orders/create payload, to turn a paid order into a booking
# write_app_proxy      — required by Shopify for any app that declares [app_proxy]
#
# Request only what the code uses (App Store requirement 3.2). Add
# write_draft_orders / read+write_customers back only together with the code
# that needs them.
#
# Reading customer name, email and phone from an order is Protected Customer
# Data, so the app needs that approval at review (Partner Dashboard → API
# access → Protected customer data: Name, Email, Phone). It is unavoidable for
# a booking app — a confirmation email has to go somewhere.
# https://shopify.dev/docs/apps/launch/protected-customer-data
scopes = "read_products,write_products,read_orders,write_app_proxy"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[app_proxy]
# Storefront-visible path is <shop>/apps/booking/*, which the theme app
# extension fetches for availability. The CLI rewrites `url` to the tunnel
# during `shopify app dev` only; set the production host in the production toml.
url = "https://example.com/proxy"
subpath = "booking"
prefix = "apps"

[webhooks]
# Keep in step with ApiVersion in app/shopify.server.ts. Do not let the CLI
# bump this to a release candidate.
api_version = "2026-10"

  # Handled by: app/routes/webhooks.app.uninstalled.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  # Handled by: app/routes/webhooks.app.scopes_update.tsx
  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  # The booking pipeline. orders/create is the one that actually creates a
  # Booking row; the other two release the slot again.
  #
  # Order topics carry protected customer data: Shopify refuses to register
  # them until "Protected customer data access" (Name + Email) is saved for
  # this app in the Dev/Partner Dashboard → API access.
  #
  # Handled by: app/routes/webhooks.orders.create.tsx (Booking + confirmation email)
  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

  # Not handled yet — re-enable with their route files.
  # [[webhooks.subscriptions]]
  # topics = [ "orders/cancelled" ]
  # uri = "/webhooks/orders/cancelled"
  #
  # [[webhooks.subscriptions]]
  # topics = [ "refunds/create" ]
  # uri = "/webhooks/refunds/create"

  # Mandatory compliance topics for a public app.
  # https://shopify.dev/docs/apps/build/privacy-law-compliance
  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/data_request"
  compliance_topics = [ "customers/data_request" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/customers/redact"
  compliance_topics = [ "customers/redact" ]

  [[webhooks.subscriptions]]
  uri = "/webhooks/shop/redact"
  compliance_topics = [ "shop/redact" ]

[build]
automatically_update_urls_on_dev = true
